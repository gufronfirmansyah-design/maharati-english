<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Lab - English Maharati</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-dark: #46a302;
            --duo-blue: #1cb0f6;
            --duo-blue-dark: #1899d6;
            --duo-orange: #ff9600;
            --duo-orange-dark: #e58700;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f7f9fa;
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .font-game { font-family: 'Fredoka', sans-serif; }
        .duo-card {
            background: #ffffff;
            border: 3px solid #e5e5e5;
            border-bottom: 6px solid #e5e5e5;
        }
        .btn-duo-green {
            background-color: var(--duo-green);
            box-shadow: 0 5px 0 0 var(--duo-green-dark);
        }
        .btn-duo-green:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 0 var(--duo-green-dark);
        }
        .btn-duo-white {
            background-color: #ffffff;
            color: #4b4b4b;
            border: 2px solid #e5e5e5;
            box-shadow: 0 4px 0 0 #e5e5e5;
        }
        .btn-duo-white:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 0 #e5e5e5;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 select-none text-slate-800">

    <!-- Top Navigation -->
    <header class="max-w-3xl w-full mx-auto flex items-center justify-between pb-4">
        <a href="../" onclick="playClick()" class="btn-duo-white px-4 py-2.5 rounded-2xl text-xs font-black uppercase flex items-center gap-2 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Menu Utama
        </a>
        <div class="flex items-center gap-3">
            <span id="student-badge" class="px-3 py-1.5 rounded-xl bg-emerald-100 text-emerald-800 font-bold text-xs font-game">
                👤 Siswa
            </span>
            <div class="px-3.5 py-1.5 rounded-xl bg-amber-100 border-2 border-amber-300 font-black text-xs text-amber-700 flex items-center gap-1.5">
                <i data-lucide="flame" class="w-4 h-4 fill-amber-500 text-amber-500"></i>
                <span id="score-display">0 XP</span>
            </div>
        </div>
    </header>

    <!-- Main Reading Question Container -->
    <main class="max-w-2xl w-full mx-auto my-auto space-y-5">
        <div class="duo-card p-6 sm:p-8 rounded-[2.5rem] space-y-6">
            <div class="flex items-center justify-between">
                <span class="text-xs font-black uppercase text-[#58cc02] tracking-wider font-game">
                    📖 Reading Comprehension
                </span>
                <button onclick="speakText()" class="p-3 rounded-2xl bg-emerald-100 hover:bg-emerald-200 text-[#46a302] transition">
                    <i data-lucide="volume-2" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Paragraph -->
            <div class="p-5 rounded-2xl bg-slate-50 border-2 border-slate-200">
                <p id="story-text" class="text-base sm:text-lg font-bold text-slate-700 leading-relaxed italic">
                    Memuat cerita bacaan...
                </p>
            </div>

            <!-- Question -->
            <div>
                <p class="text-xs font-black uppercase text-slate-400 tracking-wider mb-1">Pertanyaan:</p>
                <h3 id="question-text" class="text-lg sm:text-xl font-black text-slate-800 font-game">
                    Pertanyaan pemahaman...
                </h3>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="grid gap-3">
                <!-- Diisi otomatis oleh JavaScript -->
            </div>
        </div>
    </main>

    <!-- Toast Feedback -->
    <div id="toast" class="hidden max-w-md w-full mx-auto p-4 rounded-2xl text-center font-black text-white text-sm shadow-xl transition-all"></div>

    <footer class="text-center text-xs font-bold text-slate-400 py-2 font-game">
        Modul /reading/ • SMKN 2 Mantangai Kapuas
    </footer>

    <script>
        const SUPABASE_URL = "https://ruwzhfbdywroqhbfktfk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_twuLSbU5VBhEO9nILQNkAg_bKOJdCj-";

        const DEFAULT_READING = [
            { text: "Sarah waters the fresh flowers in her garden every morning before going to school.", q: "When does Sarah water the flowers?", options: ["Every morning", "At night", "In the afternoon"], a: "Every morning" },
            { text: "Computer processors generate significant heat, requiring cooling fans to prevent hardware failure.", q: "What do cooling fans prevent?", options: ["Hardware failure", "Power outage", "Monitor blur"], a: "Hardware failure" },
            { text: "Vocational students practice network cabling in the computer laboratory twice a week.", q: "Where do students practice cabling?", options: ["In the laboratory", "In the schoolyard", "In the canteen"], a: "In the laboratory" }
        ];

        let studentName = localStorage.getItem('studentName') || "Siswa Baru";
        let score = 0;
        let currentIndex = 0;
        let currentItem = null;

        let audioCtx = null;
        function playClick() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(650, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function loadQuestion() {
            currentItem = DEFAULT_READING[currentIndex % DEFAULT_READING.length];
            document.getElementById('story-text').innerText = `"${currentItem.text}"`;
            document.getElementById('question-text').innerText = currentItem.q;

            const container = document.getElementById('options-container');
            container.innerHTML = currentItem.options.map(opt => `
                <button onclick="playClick(); checkAnswer('${opt.replace(/'/g, "\\'")}')" class="w-full p-4 rounded-2xl btn-duo-white font-extrabold text-sm sm:text-base text-left hover:border-emerald-400 transition">
                    ${opt}
                </button>
            `).join('');
            lucide.createIcons();
        }

        async function checkAnswer(chosen) {
            const isCorrect = chosen.trim().toLowerCase() === currentItem.a.trim().toLowerCase();
            const toast = document.getElementById('toast');
            toast.classList.remove('hidden', 'bg-emerald-500', 'bg-rose-500');

            if (isCorrect) {
                score += 20;
                document.getElementById('score-display').innerText = `${score} XP`;
                toast.classList.add('bg-emerald-500');
                toast.innerText = "✓ Luar Biasa! Jawabanmu Benar (+20 XP)";
                saveScoreToSupabase(20);
                setTimeout(() => {
                    toast.classList.add('hidden');
                    currentIndex++;
                    loadQuestion();
                }, 1400);
            } else {
                toast.classList.add('bg-rose-500');
                toast.innerText = "✗ Kurang tepat. Coba perhatikan lagi teksnya!";
                setTimeout(() => toast.classList.add('hidden'), 1800);
            }
        }

        function speakText() {
            if (!('speechSynthesis' in window) || !currentItem) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(currentItem.text);
            u.lang = 'en-US';
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        async function saveScoreToSupabase(pts) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/recap`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify([{ name: studentName, activity: "Reading", level: "Easy", score: pts }])
                });
            } catch(e) {}
        }

        window.onload = () => {
            document.getElementById('student-badge').innerText = `👤 ${studentName}`;
            loadQuestion();
        };
    </script>
</body>
</html>
