<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentence Spin - English Maharati</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f7f9fa;
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .font-game { font-family: 'Fredoka', sans-serif; }
        .duo-card {
            background: #ffffff;
            border: 3px solid #e5e5e5;
            border-bottom: 6px solid #e5e5e5;
        }
        .btn-duo-purple {
            background-color: #ce82ff;
            box-shadow: 0 5px 0 0 #a560cc;
        }
        .btn-duo-purple:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 0 #a560cc;
        }
        .btn-duo-green {
            background-color: #58cc02;
            box-shadow: 0 5px 0 0 #46a302;
        }
        .btn-duo-green:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 0 #46a302;
        }
        .btn-duo-white {
            background-color: #ffffff;
            color: #4b4b4b;
            border: 2px solid #e5e5e5;
            box-shadow: 0 4px 0 0 #e5e5e5;
        }
        .wheel-spin {
            transition: transform 3.8s cubic-bezier(0.15, 0, 0.15, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 select-none text-slate-800">

    <header class="max-w-3xl w-full mx-auto flex items-center justify-between pb-4">
        <a href="../" onclick="playClick()" class="btn-duo-white px-4 py-2.5 rounded-2xl text-xs font-black uppercase flex items-center gap-2 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Menu Utama
        </a>
        <div class="flex items-center gap-3">
            <span id="student-badge" class="px-3 py-1.5 rounded-xl bg-purple-100 text-purple-800 font-bold text-xs font-game">
                👤 Siswa
            </span>
            <div class="px-3.5 py-1.5 rounded-xl bg-amber-100 border-2 border-amber-300 font-black text-xs text-amber-700 flex items-center gap-1.5">
                <i data-lucide="flame" class="w-4 h-4 fill-amber-500 text-amber-500"></i>
                <span id="score-display">0 XP</span>
            </div>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto my-auto space-y-6 text-center">
        <div class="duo-card p-6 sm:p-8 rounded-[2.5rem] space-y-6">
            <span class="text-xs font-black uppercase text-purple-600 tracking-wider font-game">
                🎡 Daily Sentence Spin
            </span>

            <!-- Roulette Wheel Container -->
            <div class="relative w-56 h-56 sm:w-64 sm:h-64 mx-auto my-2">
                <div id="wheel" class="w-full h-full rounded-full border-4 border-slate-800 bg-white relative overflow-hidden wheel-spin shadow-xl">
                    <div class="absolute top-0 left-0 w-full h-full" style="transform: rotate(0deg); clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 30%); background-color: #58cc02;"></div>
                    <div class="absolute top-0 left-0 w-full h-full" style="transform: rotate(60deg); clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 30%); background-color: #1cb0f6;"></div>
                    <div class="absolute top-0 left-0 w-full h-full" style="transform: rotate(120deg); clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 30%); background-color: #ff9600;"></div>
                    <div class="absolute top-0 left-0 w-full h-full" style="transform: rotate(180deg); clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 30%); background-color: #ff4b4b;"></div>
                    <div class="absolute top-0 left-0 w-full h-full" style="transform: rotate(240deg); clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 30%); background-color: #ce82ff;"></div>
                    <div class="absolute top-0 left-0 w-full h-full" style="transform: rotate(300deg); clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 30%); background-color: #ffc800;"></div>
                </div>
                <!-- Needle Indicator -->
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-6 h-8 bg-slate-900 z-10" style="clip-path: polygon(0% 0%, 100% 0%, 50% 100%);"></div>
            </div>

            <!-- Result Card -->
            <div id="result-box" class="hidden p-4 rounded-2xl bg-slate-50 border-2 border-purple-200 text-left space-y-3">
                <p class="text-[11px] font-black uppercase text-purple-600">Lanjutkan Kalimat Ini:</p>
                <p id="prompt-text" class="text-base font-black text-slate-800 italic"></p>
                <input type="text" id="input-sentence" placeholder="Tulis kelanjutan kalimatmu..." class="w-full p-3 rounded-xl border-2 border-slate-200 outline-none text-xs font-bold bg-white focus:border-purple-500">
                <button onclick="submitSentence()" class="w-full py-3 rounded-xl btn-duo-green text-white font-black text-xs uppercase tracking-wider">
                    Simpan Kalimat (+10 XP)
                </button>
            </div>

            <button id="spin-btn" onclick="spinWheel()" class="w-full py-4 rounded-2xl btn-duo-purple text-white font-black text-base uppercase tracking-wider transition">
                PUTAR RODA SEKARANG!
            </button>
        </div>
    </main>

    <footer class="text-center text-xs font-bold text-slate-400 py-2 font-game">
        Modul /roulette/ • SMKN 2 Mantangai Kapuas
    </footer>

    <script>
        const SUPABASE_URL = "https://ruwzhfbdywroqhbfktfk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_twuLSbU5VBhEO9nILQNkAg_bKOJdCj-";

        const PROMPTS = [
            "My favorite hobby after school is...",
            "In my future career, I hope to...",
            "One habit that makes me productive is...",
            "The most interesting computer part is...",
            "When I practice English with friends, I..."
        ];

        let studentName = localStorage.getItem('studentName') || "Siswa Baru";
        let score = 0;

        function playClick() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(650, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        function spinWheel() {
            playClick();
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spin-btn');
            const deg = Math.floor(Math.random() * 360) + 1440;
            wheel.style.transform = `rotate(${deg}deg)`;
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50');

            setTimeout(() => {
                const selected = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
                document.getElementById('prompt-text').innerText = `"${selected}"`;
                document.getElementById('result-box').classList.remove('hidden');
                spinBtn.classList.add('hidden');
                
                if ('speechSynthesis' in window) {
                    const u = new SpeechSynthesisUtterance(selected);
                    u.lang = 'en-US';
                    window.speechSynthesis.speak(u);
                }
            }, 3800);
        }

        function submitSentence() {
            const val = document.getElementById('input-sentence').value.trim();
            if (!val) return;

            score += 10;
            document.getElementById('score-display').innerText = `${score} XP`;
            saveScoreToSupabase(10);

            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('input-sentence').value = '';
            const spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = false;
            spinBtn.classList.remove('opacity-50', 'hidden');
        }

        async function saveScoreToSupabase(pts) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/recap`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify([{ name: studentName, activity: "Roulette", level: "Easy", score: pts }])
                });
            } catch(e) {}
        }

        window.onload = () => {
            document.getElementById('student-badge').innerText = `👤 ${studentName}`;
            lucide.createIcons();
        };
    </script>
</body>
</html>
