<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentence Roulette - English Maharati</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --duo-purple: #ce82ff;
            --duo-purple-shadow: #a560cc;
            --duo-green: #58cc02;
            --duo-green-shadow: #46a302;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #faf5ff;
            background-image: 
                radial-gradient(#f3e8ff 2px, transparent 2px),
                linear-gradient(rgba(250, 245, 255, 0.92), rgba(250, 245, 255, 0.96)),
                url('../asset/bg-maharati.gif');
            background-size: 24px 24px, cover, cover;
            background-position: 0 0, center, center;
            background-attachment: fixed;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-game { font-family: 'Fredoka', sans-serif; }
        
        .duo-card {
            background: #ffffff;
            border: 3px solid #f3e8ff;
            border-bottom-width: 6px;
            transition: all 0.15s ease-in-out;
        }
        .duo-card:hover {
            border-color: #e9d5ff;
        }

        .btn-duo-purple {
            background-color: var(--duo-purple);
            box-shadow: 0 5px 0 0 var(--duo-purple-shadow);
        }
        .btn-duo-purple:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 0 var(--duo-purple-shadow);
        }

        .btn-duo-green {
            background-color: var(--duo-green);
            box-shadow: 0 5px 0 0 var(--duo-green-shadow);
        }
        .btn-duo-green:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 0 var(--duo-green-shadow);
        }

        .btn-duo-white {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-bottom: 4px solid #cbd5e1;
            color: #334155;
            transition: all 0.1s ease;
        }
        .btn-duo-white:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
        }

        .wheel-rotate {
            transition: transform 3.8s cubic-bezier(0.18, 0.05, 0.15, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6 text-slate-800">

    <!-- Audio Elements dari folder asset/ induk -->
    <audio id="snd-click" src="../asset/click.mp3" preload="auto"></audio>
    <audio id="snd-right" src="../asset/right.mp3" preload="auto"></audio>
    <audio id="snd-victory" src="../asset/victory.mp3" preload="auto"></audio>

    <!-- Header Navigation -->
    <header class="max-w-4xl w-full mx-auto flex items-center justify-between pb-4">
        <!-- Tautan eksplisit ke index.html agar tidak muncul Index of... -->
        <a href="../index.html" onclick="playClickSound()" class="btn-duo-white px-4 py-2.5 rounded-2xl text-xs font-black uppercase flex items-center gap-2 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Menu Utama</span>
        </a>

        <div class="flex items-center gap-2 sm:gap-3">
            <div class="px-3.5 py-2 rounded-2xl bg-purple-100 border-2 border-purple-300 font-bold text-xs text-purple-800 flex items-center gap-1.5 shadow-sm">
                <i data-lucide="user" class="w-4 h-4 text-purple-600"></i>
                <span id="student-badge" class="max-w-[100px] sm:max-w-[140px] truncate">Siswa Baru</span>
            </div>

            <div class="px-3.5 py-2 rounded-2xl bg-amber-100 border-2 border-amber-300 font-black text-xs text-amber-800 flex items-center gap-1.5 shadow-sm">
                <i data-lucide="flame" class="w-4 h-4 fill-amber-500 text-amber-500"></i>
                <span id="score-display">0 XP</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="max-w-xl w-full mx-auto my-auto space-y-4">
        <div class="duo-card p-5 sm:p-7 rounded-[2.5rem] text-center space-y-5 bg-white shadow-sm">
            
            <!-- Top Card Action Bar -->
            <div class="flex items-center justify-between border-b border-purple-100 pb-3">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-purple-500 animate-ping"></span>
                    <span class="text-xs font-black uppercase text-purple-600 tracking-wider font-game">
                        Sentence Roulette Spin
                    </span>
                </div>

                <span id="round-counter" class="px-3 py-1 rounded-xl bg-purple-50 border border-purple-200 font-black text-[11px] text-purple-700">
                    Putaran Ke-1
                </span>
            </div>

            <!-- Roulette Wheel Visual Container -->
            <div class="relative w-56 h-56 sm:w-64 sm:h-64 mx-auto my-2">
                <!-- Jarum Penunjuk Atas (Needle Pointer) -->
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-20 w-7 h-9 drop-shadow-md" style="clip-path: polygon(50% 100%, 0 0, 100% 0); background-color: #f59e0b;"></div>
                
                <!-- Roda Putar 8 Segmen Warna Berbeda -->
                <div id="roulette-wheel" class="w-full h-full rounded-full border-4 border-slate-800 relative overflow-hidden wheel-rotate shadow-xl bg-slate-900">
                    <svg viewBox="0 0 100 100" class="w-full h-full">
                        <!-- 8 Potongan Segmen Roda (45 derajat tiap slice) -->
                        <path d="M50 50 L50 0 A50 50 0 0 1 85.36 14.64 Z" fill="#58cc02" />
                        <path d="M50 50 L85.36 14.64 A50 50 0 0 1 100 50 Z" fill="#1cb0f6" />
                        <path d="M50 50 L100 50 A50 50 0 0 1 85.36 85.36 Z" fill="#ff9600" />
                        <path d="M50 50 L85.36 85.36 A50 50 0 0 1 50 100 Z" fill="#ff4b4b" />
                        <path d="M50 50 L50 100 A50 50 0 0 1 14.64 85.36 Z" fill="#ce82ff" />
                        <path d="M50 50 L14.64 85.36 A50 50 0 0 1 0 50 Z" fill="#06b6d4" />
                        <path d="M50 50 L0 50 A50 50 0 0 1 14.64 14.64 Z" fill="#ffc800" />
                        <path d="M50 50 L14.64 14.64 A50 50 0 0 1 50 0 Z" fill="#ec4899" />
                        <!-- Titik Poros Tengah -->
                        <circle cx="50" cy="50" r="13" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" />
                        <circle cx="50" cy="50" r="5" fill="#a855f7" />
                    </svg>
                </div>
            </div>

            <p id="wheel-status-text" class="text-xs font-bold text-slate-400">
                Tekan tombol di bawah untuk memutar roda ide kalimat!
            </p>

            <!-- Result Box (Muncul setelah roda berhenti) -->
            <div id="result-box" class="hidden p-4 sm:p-5 rounded-2xl bg-purple-50/70 border-2 border-purple-200 text-left space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-black uppercase text-purple-600 tracking-wider">
                        ✨ Template Kalimat Terpilih:
                    </span>
                    <button onclick="speakCurrentPrompt()" title="Dengarkan Contoh Ucapan" class="p-1.5 rounded-lg bg-purple-200 text-purple-800 hover:bg-purple-300">
                        <i data-lucide="volume-2" class="w-4 h-4"></i>
                    </button>
                </div>
                
                <p id="prompt-display" class="text-base sm:text-lg font-black text-slate-800 italic leading-snug">
                    "Memuat kalimat..."
                </p>

                <div class="space-y-2 pt-1">
                    <label class="text-[11px] font-bold text-slate-500 uppercase">Lanjutkan kalimatmu dalam bahasa Inggris:</label>
                    <input type="text" id="input-continuation" placeholder="Contoh: because it gives me energy..." class="w-full p-3.5 rounded-xl border-2 border-slate-200 outline-none font-bold text-xs sm:text-sm bg-white focus:border-purple-500 shadow-inner" maxlength="80">
                </div>

                <button onclick="submitSentence()" class="w-full py-3.5 rounded-xl btn-duo-green text-white font-black text-xs sm:text-sm uppercase tracking-wider flex items-center justify-center gap-2">
                    <span>Simpan Kalimat (+15 XP)</span>
                    <i data-lucide="check" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Tombol Putar Roda -->
            <button id="btn-spin" onclick="spinWheel()" class="w-full py-4 rounded-2xl btn-duo-purple text-white font-black text-sm sm:text-base uppercase tracking-wider transition flex items-center justify-center gap-2">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                <span>PUTAR RODA SEKARANG!</span>
            </button>
        </div>
    </main>

    <!-- Feedback Toast -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 max-w-sm w-full p-4 rounded-2xl text-center font-black text-white text-xs sm:text-sm shadow-xl z-50 transition-all"></div>

    <!-- Footer -->
    <footer class="text-center text-xs font-bold text-slate-400 py-3 font-game">
        Modul /roulette/ • English Maharati Learning System • SMKN 2 Mantangai
    </footer>

    <!-- Script Logika Permainan -->
    <script>
        const SUPABASE_URL = "https://ruwzhfbdywroqhbfktfk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_twuLSbU5VBhEO9nILQNkAg_bKOJdCj-";

        // Bank Template Kalimat Bahasa Inggris
        const PROMPTS_BANK = [
            "My favorite hobby after school is...",
            "In my future career as a technician, I want to...",
            "One healthy habit that makes me productive is...",
            "The most essential computer component for me is...",
            "When I practice English with my classmates, I feel...",
            "To prevent hardware failure, we should regularly...",
            "If I could create my own computer software, it would...",
            "Every morning before going to vocational school, I..."
        ];

        let spinCount = 0;
        let score = 0;
        let currentPrompt = "";
        let isSpinning = false;
        let currentWheelAngle = 0;
        const studentName = localStorage.getItem('studentName') || "Siswa Baru";

        // ==============================================================
        // AUDIO EFFECT ENGINE (FILE + PROCEDURAL FALLBACK)
        // ==============================================================
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const Cls = window.AudioContext || window.webkitAudioContext;
                if (Cls) audioCtx = new Cls();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playTone(freq, dur = 0.08, type = 'sine') {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.18, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + dur);
            } catch(e) {}
        }

        function playSound(elementId, fallbackFreq = 650) {
            const el = document.getElementById(elementId);
            if (el && el.readyState >= 2) {
                el.currentTime = 0;
                el.play().catch(() => playTone(fallbackFreq));
            } else {
                playTone(fallbackFreq);
            }
        }

        function playClickSound() { playSound('snd-click', 650); }

        // ==============================================================
        // GAMEPLAY & ROULETTE LOGIC
        // ==============================================================
        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            playClickSound();

            const wheel = document.getElementById('roulette-wheel');
            const spinBtn = document.getElementById('btn-spin');
            const statusText = document.getElementById('wheel-status-text');
            const resultBox = document.getElementById('result-box');

            resultBox.classList.add('hidden');
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50');
            statusText.innerText = "🌀 Roda sedang berputar...";

            // Putaran acak minimal 4-6 putaran penuh + sudut acak
            const randomExtraDeg = Math.floor(Math.random() * 360);
            currentWheelAngle += 1440 + randomExtraDeg;
            wheel.style.transform = `rotate(${currentWheelAngle}deg)`;

            // Suara ticking berirama selama roda berputar
            let tickCount = 0;
            const tickInterval = setInterval(() => {
                playTone(700 + (tickCount % 4) * 80, 0.03, 'triangle');
                tickCount++;
                if (tickCount > 18) clearInterval(tickInterval);
            }, 180);

            setTimeout(() => {
                isSpinning = false;
                spinCount++;
                document.getElementById('round-counter').innerText = `Putaran Ke-${spinCount}`;

                // Pilih acak kalimat dari bank soal
                currentPrompt = PROMPTS_BANK[Math.floor(Math.random() * PROMPTS_BANK.length)];
                document.getElementById('prompt-display').innerText = `"${currentPrompt}"`;
                document.getElementById('input-continuation').value = '';

                resultBox.classList.remove('hidden');
                spinBtn.classList.add('hidden');
                statusText.innerText = "Lanjutkan kalimat di atas dan kumpulkan XP!";
                
                playSound('snd-right', 880);
                speakCurrentPrompt();
                lucide.createIcons();
            }, 3900);
        }

        function submitSentence() {
            const inputVal = document.getElementById('input-continuation').value.trim();
            if (inputVal.length < 3) {
                showToast("⚠️ Tuliskan minimal beberapa kata kelanjutan ya!", false);
                return;
            }

            playSound('snd-victory', 900);
            score += 15;
            document.getElementById('score-display').innerText = `${score} XP`;
            showToast("✨ Kalimat tersimpan! (+15 XP)", true);
            saveScoreToSupabase(15);

            document.getElementById('result-box').classList.add('hidden');
            const spinBtn = document.getElementById('btn-spin');
            spinBtn.disabled = false;
            spinBtn.classList.remove('opacity-50', 'hidden');
            document.getElementById('wheel-status-text').innerText = "Siap untuk putaran berikutnya!";
        }

        // ==============================================================
        // SPEECH SYNTHESIS (TTS)
        // ==============================================================
        function speakCurrentPrompt() {
            playClickSound();
            if ('speechSynthesis' in window && currentPrompt) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(currentPrompt);
                u.lang = 'en-US';
                u.rate = 0.88;
                window.speechSynthesis.speak(u);
            }
        }

        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById('toast');
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 max-w-sm w-full p-4 rounded-2xl text-center font-black text-white text-xs sm:text-sm shadow-xl z-50 transition-all ${isSuccess ? 'bg-purple-600' : 'bg-amber-500'}`;
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2200);
        }

        // ==============================================================
        // SUPABASE DATABASE SYNC
        // ==============================================================
        async function saveScoreToSupabase(pts) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/recap`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify([{ name: studentName, activity: "Roulette", level: "Easy", score: pts }])
                });
            } catch(e) {}
        }

        window.onload = () => {
            document.getElementById('student-badge').innerText = studentName;
            lucide.createIcons();
        };
    </script>
</body>
</html>
