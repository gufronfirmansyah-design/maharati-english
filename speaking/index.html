<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Lab - English Maharati</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-dark: #46a302;
            --duo-blue: #1cb0f6;
            --duo-blue-dark: #1899d6;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f7f9fa;
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .font-game { font-family: 'Fredoka', sans-serif; }
        .duo-card {
            background: #ffffff;
            border: 3px solid #e5e5e5;
            border-bottom: 6px solid #e5e5e5;
        }
        .btn-duo-blue {
            background-color: var(--duo-blue);
            box-shadow: 0 5px 0 0 var(--duo-blue-dark);
        }
        .btn-duo-blue:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 0 var(--duo-blue-dark);
        }
        .btn-duo-white {
            background-color: #ffffff;
            color: #4b4b4b;
            border: 2px solid #e5e5e5;
            box-shadow: 0 4px 0 0 #e5e5e5;
        }
        .btn-duo-white:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 0 #e5e5e5;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 select-none text-slate-800">

    <header class="max-w-3xl w-full mx-auto flex items-center justify-between pb-4">
        <a href="../" onclick="playClick()" class="btn-duo-white px-4 py-2.5 rounded-2xl text-xs font-black uppercase flex items-center gap-2 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Menu Utama
        </a>
        <div class="flex items-center gap-3">
            <span id="student-badge" class="px-3 py-1.5 rounded-xl bg-blue-100 text-blue-800 font-bold text-xs font-game">
                👤 Siswa
            </span>
            <div class="px-3.5 py-1.5 rounded-xl bg-amber-100 border-2 border-amber-300 font-black text-xs text-amber-700 flex items-center gap-1.5">
                <i data-lucide="flame" class="w-4 h-4 fill-amber-500 text-amber-500"></i>
                <span id="score-display">0 XP</span>
            </div>
        </div>
    </header>

    <main class="max-w-xl w-full mx-auto my-auto space-y-6">
        <div class="duo-card p-6 sm:p-8 rounded-[2.5rem] text-center space-y-6">
            <span class="text-xs font-black uppercase text-blue-500 tracking-wider font-game">
                🎙️ Speaking & Pronunciation
            </span>

            <div>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Tirukan Kalimat Ini:</p>
                <h2 id="target-phrase" class="text-2xl sm:text-3xl font-black text-slate-800 font-game leading-tight italic">
                    "Practice makes perfect"
                </h2>
            </div>

            <!-- Controls -->
            <div class="flex justify-center items-center gap-4 pt-2">
                <button onclick="playTTS()" title="Dengarkan Contoh" class="w-14 h-14 rounded-2xl btn-duo-white flex items-center justify-center text-blue-500 transition">
                    <i data-lucide="volume-2" class="w-6 h-6"></i>
                </button>
                <button id="btn-mic" onclick="toggleMic()" class="w-24 h-24 rounded-3xl btn-duo-blue text-white flex items-center justify-center transition shadow-lg">
                    <i data-lucide="mic" class="w-10 h-10"></i>
                </button>
            </div>

            <p id="mic-status" class="text-xs font-bold text-slate-400">
                Tekan tombol mikrofon biru dan ucapkan dengan jelas
            </p>

            <div id="transcript-box" class="p-4 rounded-2xl bg-slate-50 border-2 border-dashed border-slate-200 text-xs font-bold text-slate-600 min-h-[48px] flex items-center justify-center">
                Belum ada suara terdeteksi
            </div>
        </div>
    </main>

    <div id="toast" class="hidden max-w-md w-full mx-auto p-4 rounded-2xl text-center font-black text-white text-sm shadow-xl transition-all"></div>

    <footer class="text-center text-xs font-bold text-slate-400 py-2 font-game">
        Modul /speaking/ • SMKN 2 Mantangai Kapuas
    </footer>

    <script>
        const SUPABASE_URL = "https://ruwzhfbdywroqhbfktfk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_twuLSbU5VBhEO9nILQNkAg_bKOJdCj-";

        const PHRASES = [
            "Practice makes perfect in learning",
            "Good morning teachers and friends",
            "Technology helps our education",
            "I love studying English at school",
            "Always keep the computer room clean"
        ];

        let studentName = localStorage.getItem('studentName') || "Siswa Baru";
        let score = 0;
        let phraseIndex = 0;
        let isListening = false;
        let recognition = null;

        function playClick() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        function loadPhrase() {
            document.getElementById('target-phrase').innerText = `"${PHRASES[phraseIndex % PHRASES.length]}"`;
            document.getElementById('transcript-box').innerText = "Tekan mikrofon lalu ucapkan kalimat di atas...";
            lucide.createIcons();
        }

        function playTTS() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(PHRASES[phraseIndex % PHRASES.length]);
            u.lang = 'en-US';
            u.rate = 0.88;
            window.speechSynthesis.speak(u);
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.webkitSpeechRecognition || window.SpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                document.getElementById('transcript-box').innerText = `Terdeteksi: "${transcript}"`;
                evaluateSpeech(transcript);
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('mic-status').innerText = "Selesai mendengarkan.";
                document.getElementById('btn-mic').classList.remove('animate-pulse', 'bg-rose-500');
            };
        }

        function toggleMic() {
            if (!recognition) {
                alertCustom("Speech Recognition belum didukung pada browser ini. Gunakan Google Chrome.");
                return;
            }
            playClick();
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                    isListening = true;
                    document.getElementById('mic-status').innerText = "Sedang mendengarkan... Ucapkan sekarang!";
                    document.getElementById('btn-mic').classList.add('animate-pulse', 'bg-rose-500');
                } catch(e) {}
            }
        }

        function evaluateSpeech(spoken) {
            const target = PHRASES[phraseIndex % PHRASES.length];
            const cleanS = spoken.toLowerCase().replace(/[^a-z0-9 ]/g, "").trim().split(/\s+/);
            const cleanT = target.toLowerCase().replace(/[^a-z0-9 ]/g, "").trim().split(/\s+/);

            let matches = 0;
            cleanT.forEach(w => { if (cleanS.includes(w)) matches++; });
            const accuracy = matches / cleanT.length;

            const toast = document.getElementById('toast');
            toast.classList.remove('hidden', 'bg-emerald-500', 'bg-rose-500');

            if (accuracy >= 0.6) {
                score += 25;
                document.getElementById('score-display').innerText = `${score} XP`;
                toast.classList.add('bg-emerald-500');
                toast.innerText = "✓ Bagus Sekali! Pelafalan Jelas (+25 XP)";
                saveScoreToSupabase(25);
                setTimeout(() => {
                    toast.classList.add('hidden');
                    phraseIndex++;
                    loadPhrase();
                }, 1500);
            } else {
                toast.classList.add('bg-rose-500');
                toast.innerText = "✗ Belum pas. Tekan ikon suara dan coba ulangi lagi ya!";
                setTimeout(() => toast.classList.add('hidden'), 2000);
            }
        }

        async function saveScoreToSupabase(pts) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/recap`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify([{ name: studentName, activity: "Speaking", level: "Easy", score: pts }])
                });
            } catch(e) {}
        }

        window.onload = () => {
            document.getElementById('student-badge').innerText = `👤 ${studentName}`;
            loadPhrase();
        };
    </script>
</body>
</html>
