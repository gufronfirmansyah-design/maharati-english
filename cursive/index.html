<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursive Canvas - English Maharati</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f7f9fa;
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .font-game { font-family: 'Fredoka', sans-serif; }
        .font-cursive { font-family: 'Dancing Script', cursive; }
        .duo-card {
            background: #ffffff;
            border: 3px solid #e5e5e5;
            border-bottom: 6px solid #e5e5e5;
        }
        .btn-duo-red {
            background-color: #ff4b4b;
            box-shadow: 0 5px 0 0 #ea2b2b;
        }
        .btn-duo-red:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 0 #ea2b2b;
        }
        .btn-duo-white {
            background-color: #ffffff;
            color: #4b4b4b;
            border: 2px solid #e5e5e5;
            box-shadow: 0 4px 0 0 #e5e5e5;
        }
        .btn-duo-white:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 0 #e5e5e5;
        }
        #paint-canvas {
            touch-action: none;
            background-image: linear-gradient(#f1f5f9 1px, transparent 1px);
            background-size: 100% 36px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 select-none text-slate-800">

    <header class="max-w-3xl w-full mx-auto flex items-center justify-between pb-4">
        <a href="../" onclick="playClick()" class="btn-duo-white px-4 py-2.5 rounded-2xl text-xs font-black uppercase flex items-center gap-2 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Menu Utama
        </a>
        <div class="flex items-center gap-3">
            <span id="student-badge" class="px-3 py-1.5 rounded-xl bg-rose-100 text-rose-800 font-bold text-xs font-game">
                👤 Siswa
            </span>
            <div class="px-3.5 py-1.5 rounded-xl bg-amber-100 border-2 border-amber-300 font-black text-xs text-amber-700 flex items-center gap-1.5">
                <i data-lucide="flame" class="w-4 h-4 fill-amber-500 text-amber-500"></i>
                <span id="score-display">0 XP</span>
            </div>
        </div>
    </header>

    <main class="max-w-2xl w-full mx-auto my-auto space-y-5">
        <div class="duo-card p-6 sm:p-7 rounded-[2.5rem] space-y-4">
            <div class="flex items-center justify-between">
                <span class="text-xs font-black uppercase text-rose-500 tracking-wider font-game">
                    ✍️ Cursive Writing Canvas
                </span>
                <div class="flex gap-2">
                    <button onclick="playTTS()" title="Dengarkan Kata" class="p-2.5 rounded-xl btn-duo-white text-indigo-600 transition">
                        <i data-lucide="volume-2" class="w-4 h-4"></i>
                    </button>
                    <button onclick="clearCanvas()" title="Hapus Tulisan" class="p-2.5 rounded-xl btn-duo-white text-rose-600 transition">
                        <i data-lucide="eraser" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Cursive Target Word -->
            <div class="text-center py-2 border-b-2 border-slate-100">
                <p id="cursive-word" class="text-5xl sm:text-7xl font-cursive text-slate-800">
                    Keyboard
                </p>
                <p class="text-[11px] font-bold text-slate-400 mt-1">Tulis kembali kata di atas di atas garis kanvas</p>
            </div>

            <!-- Touch Drawing Canvas -->
            <div class="w-full flex justify-center">
                <canvas id="paint-canvas" class="w-full rounded-2xl border-2 border-slate-300 bg-white shadow-inner"></canvas>
            </div>

            <button onclick="playClick(); completeWord();" class="w-full py-4 rounded-2xl btn-duo-red text-white font-black text-sm uppercase tracking-wider transition">
                Selesai & Kata Berikutnya ➡️
            </button>
        </div>
    </main>

    <footer class="text-center text-xs font-bold text-slate-400 py-2 font-game">
        Modul /cursive/ • SMKN 2 Mantangai Kapuas
    </footer>

    <script>
        const SUPABASE_URL = "https://ruwzhfbdywroqhbfktfk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_twuLSbU5VBhEO9nILQNkAg_bKOJdCj-";

        const WORDS = ["Keyboard", "Monitor", "Network", "Hardware", "Software", "Internet", "Screen"];
        let studentName = localStorage.getItem('studentName') || "Siswa Baru";
        let score = 0;
        let wordIndex = 0;

        function playClick() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(700, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = 220;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#e11d48';
        }

        let isPainting = false;
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startPaint(e) {
            isPainting = true;
            const p = getPos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
        }

        function draw(e) {
            if (!isPainting) return;
            const p = getPos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        }

        function stopPaint() { isPainting = false; }

        canvas.addEventListener('mousedown', startPaint);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopPaint);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startPaint(e); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
        window.addEventListener('touchend', stopPaint);

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function playTTS() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(WORDS[wordIndex % WORDS.length]);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }

        function completeWord() {
            score += 15;
            document.getElementById('score-display').innerText = `${score} XP`;
            saveScoreToSupabase(15);
            clearCanvas();
            wordIndex++;
            document.getElementById('cursive-word').innerText = WORDS[wordIndex % WORDS.length];
        }

        async function saveScoreToSupabase(pts) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/recap`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify([{ name: studentName, activity: "Cursive", level: "Easy", score: pts }])
                });
            } catch(e) {}
        }

        window.onload = () => {
            document.getElementById('student-badge').innerText = `👤 ${studentName}`;
            document.getElementById('cursive-word').innerText = WORDS[0];
            resizeCanvas();
            lucide.createIcons();
        };
        window.onresize = resizeCanvas;
    </script>
</body>
</html>
