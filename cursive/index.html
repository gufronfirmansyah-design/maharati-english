<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cursive Board - English Maharati</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Fredoka:wght@500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --duo-rose: #f43f5e;
            --duo-rose-shadow: #e11d48;
            --duo-green: #58cc02;
            --duo-green-shadow: #46a302;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fff1f2;
            background-image: 
                radial-gradient(#fecdd3 2px, transparent 2px),
                linear-gradient(rgba(255, 241, 242, 0.92), rgba(255, 241, 242, 0.96)),
                url('../asset/bg-maharati.gif');
            background-size: 24px 24px, cover, cover;
            background-position: 0 0, center, center;
            background-attachment: fixed;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-game { font-family: 'Fredoka', sans-serif; }
        .font-cursive { font-family: 'Dancing Script', cursive; }
        
        .duo-card {
            background: #ffffff;
            border: 3px solid #fecdd3;
            border-bottom-width: 6px;
            transition: all 0.15s ease-in-out;
        }
        .duo-card:hover {
            border-color: #fda4af;
        }

        .btn-duo-rose {
            background-color: var(--duo-rose);
            box-shadow: 0 5px 0 0 var(--duo-rose-shadow);
        }
        .btn-duo-rose:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 0 var(--duo-rose-shadow);
        }

        .btn-duo-green {
            background-color: var(--duo-green);
            box-shadow: 0 5px 0 0 var(--duo-green-shadow);
        }
        .btn-duo-green:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 0 var(--duo-green-shadow);
        }

        .btn-duo-white {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-bottom: 4px solid #cbd5e1;
            color: #334155;
            transition: all 0.1s ease;
        }
        .btn-duo-white:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
        }

        #draw-canvas {
            touch-action: none;
            cursor: crosshair;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6 text-slate-800">

    <!-- Audio Elements: Menggunakan file di folder asset/ induk -->
    <audio id="snd-click" src="../asset/click.mp3" preload="auto"></audio>
    <audio id="snd-right" src="../asset/right.mp3" preload="auto"></audio>
    <audio id="snd-victory" src="../asset/victory.mp3" preload="auto"></audio>

    <!-- Header Navigation -->
    <header class="max-w-4xl w-full mx-auto flex items-center justify-between pb-4">
        <!-- SOLUSI: Mengarah langsung ke ../index.html agar tidak muncul Index of... -->
        <a href="../index.html" onclick="playClickSound()" class="btn-duo-white px-4 py-2.5 rounded-2xl text-xs font-black uppercase flex items-center gap-2 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Menu Utama</span>
        </a>

        <div class="flex items-center gap-2 sm:gap-3">
            <div class="px-3.5 py-2 rounded-2xl bg-rose-100 border-2 border-rose-300 font-bold text-xs text-rose-800 flex items-center gap-1.5 shadow-sm">
                <i data-lucide="user" class="w-4 h-4 text-rose-600"></i>
                <span id="student-badge" class="max-w-[100px] sm:max-w-[140px] truncate">Siswa Baru</span>
            </div>

            <div class="px-3.5 py-2 rounded-2xl bg-amber-100 border-2 border-amber-300 font-black text-xs text-amber-800 flex items-center gap-1.5 shadow-sm">
                <i data-lucide="flame" class="w-4 h-4 fill-amber-500 text-amber-500"></i>
                <span id="score-display">0 XP</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="max-w-3xl w-full mx-auto my-auto space-y-4">
        <div class="duo-card p-5 sm:p-7 rounded-[2.5rem] space-y-5 bg-white shadow-sm">
            
            <!-- Top Card Action Bar -->
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-rose-100 pb-3">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></span>
                    <span class="text-xs font-black uppercase text-rose-600 tracking-wider font-game">
                        Cursive Handwriting Board
                    </span>
                </div>

                <div class="flex items-center gap-2">
                    <!-- Tombol Dengarkan Suara Pengucapan -->
                    <button onclick="speakCurrentWord()" title="Dengarkan Cara Membaca" class="btn-duo-white px-3 py-2 rounded-xl text-xs font-bold text-indigo-600 flex items-center gap-1.5">
                        <i data-lucide="volume-2" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Bunyi</span>
                    </button>
                    <!-- Tombol Hapus Kanvas -->
                    <button onclick="clearCanvas()" title="Hapus Tulisan" class="btn-duo-white px-3 py-2 rounded-xl text-xs font-bold text-rose-600 flex items-center gap-1.5">
                        <i data-lucide="eraser" class="w-4 h-4"></i>
                        <span>Hapus</span>
                    </button>
                </div>
            </div>

            <!-- Target Word Banner -->
            <div class="text-center py-2 bg-gradient-to-b from-rose-50/70 to-transparent rounded-2xl relative">
                <p class="text-[11px] font-bold text-rose-400 uppercase tracking-widest mb-1 font-game">Tulis Ulang Kata Ini:</p>
                <div id="target-word-display" class="text-6xl sm:text-7xl font-cursive text-slate-800 drop-shadow-sm tracking-wide">
                    Keyboard
                </div>
                <p id="target-meaning-display" class="text-xs font-semibold text-slate-500 italic mt-1">
                    (Papan Ketik Komputer)
                </p>
            </div>

            <!-- Drawing Area With Ruled Lines -->
            <div class="relative w-full rounded-2xl border-2 border-slate-300 bg-white overflow-hidden shadow-inner flex flex-col justify-center">
                <!-- Garis Bantu 3 Baris Buku Halus (Notebook Ruled Guide Lines) -->
                <div class="absolute inset-0 pointer-events-none flex flex-col justify-around py-6 px-4 opacity-40">
                    <div class="w-full border-b border-dashed border-rose-400"></div>
                    <div class="w-full border-b-2 border-rose-500"></div>
                    <div class="w-full border-b border-dashed border-rose-400"></div>
                </div>

                <canvas id="draw-canvas" class="w-full h-56 sm:h-64 z-10"></canvas>
            </div>

            <!-- Tool Options: Pilihan Warna Pena & Ketebalan -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-1 text-xs">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-500 text-[11px] uppercase">Warna:</span>
                    <button onclick="setPenColor('#e11d48')" class="w-7 h-7 rounded-full bg-rose-600 border-2 border-white shadow-sm ring-2 ring-rose-400 focus:scale-110 transition-transform" title="Merah Mawar"></button>
                    <button onclick="setPenColor('#2563eb')" class="w-7 h-7 rounded-full bg-blue-600 border-2 border-white shadow-sm hover:scale-105 transition-transform" title="Biru Tinta"></button>
                    <button onclick="setPenColor('#0f172a')" class="w-7 h-7 rounded-full bg-slate-900 border-2 border-white shadow-sm hover:scale-105 transition-transform" title="Hitam"></button>
                    <button onclick="setPenColor('#16a34a')" class="w-7 h-7 rounded-full bg-emerald-600 border-2 border-white shadow-sm hover:scale-105 transition-transform" title="Hijau"></button>
                </div>

                <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-500 text-[11px] uppercase">Ukuran Pena:</span>
                    <button onclick="setPenSize(3)" class="px-2.5 py-1 rounded-lg border border-slate-200 font-bold hover:bg-slate-100">Halus</button>
                    <button onclick="setPenSize(5)" class="px-2.5 py-1 rounded-lg border-2 border-rose-300 bg-rose-50 text-rose-700 font-black">Sedang</button>
                    <button onclick="setPenSize(8)" class="px-2.5 py-1 rounded-lg border border-slate-200 font-bold hover:bg-slate-100">Tebal</button>
                </div>
            </div>

            <!-- Submit Button -->
            <button onclick="finishWord()" class="w-full py-4 rounded-2xl btn-duo-rose text-white font-black text-sm sm:text-base uppercase tracking-wider transition flex items-center justify-center gap-2">
                <span>SELESAI & SIMPAN NILAI (+15 XP)</span>
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </div>
    </main>

    <!-- Feedback Toast -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 max-w-sm w-full p-4 rounded-2xl text-center font-black text-white text-xs sm:text-sm shadow-xl z-50 transition-all"></div>

    <!-- Footer -->
    <footer class="text-center text-xs font-bold text-slate-400 py-3 font-game">
        Modul /cursive/ • English Maharati Learning System • SMKN 2 Mantangai
    </footer>

    <!-- Script Logika Pembelajaran & Kanvas -->
    <script>
        const SUPABASE_URL = "https://ruwzhfbdywroqhbfktfk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_twuLSbU5VBhEO9nILQNkAg_bKOJdCj-";

        const CURSIVE_VOCAB = [
            { word: "Keyboard", meaning: "Papan Ketik Komputer" },
            { word: "Monitor", meaning: "Layar Tampilan" },
            { word: "Network", meaning: "Jaringan Komputer" },
            { word: "Hardware", meaning: "Perangkat Keras" },
            { word: "Software", meaning: "Perangkat Lunak" },
            { word: "Internet", meaning: "Jaringan Global" },
            { word: "Processor", meaning: "Otak Pemroses Data" },
            { word: "Motherboard", meaning: "Papan Sirkuit Utama" }
        ];

        let wordIndex = 0;
        let score = 0;
        let strokeCount = 0;
        const studentName = localStorage.getItem('studentName') || "Siswa Baru";

        // ==============================================================
        // AUDIO EFFECT ENGINE (FILE + PROCEDURAL FALLBACK)
        // ==============================================================
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const Cls = window.AudioContext || window.webkitAudioContext;
                if (Cls) audioCtx = new Cls();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playTone(freq, dur = 0.08, type = 'sine') {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.18, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + dur);
            } catch(e) {}
        }

        function playSound(elementId, fallbackFreq = 650) {
            const el = document.getElementById(elementId);
            if (el && el.readyState >= 2) {
                el.currentTime = 0;
                el.play().catch(() => playTone(fallbackFreq));
            } else {
                playTone(fallbackFreq);
            }
        }

        function playClickSound() { playSound('snd-click', 600); }

        // ==============================================================
        // CANVAS DRAWING ENGINE (HIGH DPI & SMOOTH TOUCH)
        // ==============================================================
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        let isPainting = false;
        let penColor = '#e11d48';
        let penSize = 5;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = penColor;
            ctx.lineWidth = penSize;
        }

        function getCanvasPoint(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            isPainting = true;
            strokeCount++;
            const pt = getCanvasPoint(e);
            ctx.beginPath();
            ctx.moveTo(pt.x, pt.y);
        }

        function draw(e) {
            if (!isPainting) return;
            const pt = getCanvasPoint(e);
            ctx.lineTo(pt.x, pt.y);
            ctx.strokeStyle = penColor;
            ctx.lineWidth = penSize;
            ctx.stroke();
        }

        function stopDrawing() {
            isPainting = false;
        }

        // Event listeners untuk mouse dan layar sentuh ponsel
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
        window.addEventListener('touchend', stopDrawing);

        function clearCanvas() {
            playClickSound();
            strokeCount = 0;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function setPenColor(color) {
            playClickSound();
            penColor = color;
        }

        function setPenSize(size) {
            playClickSound();
            penSize = size;
        }

        // ==============================================================
        // GAMEPLAY & WORD ADVANCEMENT
        // ==============================================================
        function loadWord() {
            const item = CURSIVE_VOCAB[wordIndex % CURSIVE_VOCAB.length];
            document.getElementById('target-word-display').innerText = item.word;
            document.getElementById('target-meaning-display').innerText = `(${item.meaning})`;
            clearCanvas();
        }

        function speakCurrentWord() {
            playClickSound();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const item = CURSIVE_VOCAB[wordIndex % CURSIVE_VOCAB.length];
                const u = new SpeechSynthesisUtterance(item.word);
                u.lang = 'en-US';
                u.rate = 0.85;
                window.speechSynthesis.speak(u);
            }
        }

        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById('toast');
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 max-w-sm w-full p-4 rounded-2xl text-center font-black text-white text-xs sm:text-sm shadow-xl z-50 transition-all ${isSuccess ? 'bg-emerald-500' : 'bg-amber-500'}`;
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2200);
        }

        function finishWord() {
            if (strokeCount < 3) {
                showToast("⚠️ Tuliskan minimal beberapa goresan di kanvas ya!", false);
                return;
            }

            playSound('snd-right', 880);
            score += 15;
            document.getElementById('score-display').innerText = `${score} XP`;
            showToast("✨ Tulisan tercatat! Lanjut ke kata berikutnya (+15 XP)", true);
            saveScoreToSupabase(15);

            setTimeout(() => {
                wordIndex++;
                loadWord();
            }, 900);
        }

        async function saveScoreToSupabase(pts) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/recap`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify([{ name: studentName, activity: "Cursive", level: "Easy", score: pts }])
                });
            } catch(e) {}
        }

        window.onload = () => {
            document.getElementById('student-badge').innerText = studentName;
            resizeCanvas();
            loadWord();
            lucide.createIcons();
        };
        window.onresize = resizeCanvas;
    </script>
</body>
</html>
