<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cursive Board - Maharati- English</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Fredoka:wght@500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --duo-rose: #f43f5e;
            --duo-rose-shadow: #e11d48;
            --duo-green: #58cc02;
            --duo-green-shadow: #46a302;
            --duo-blue: #1cb0f6;
            --duo-blue-shadow: #1899d6;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fff1f2;
            background-image: 
                radial-gradient(#fecdd3 2px, transparent 2px),
                linear-gradient(rgba(255, 241, 242, 0.94), rgba(255, 241, 242, 0.98)),
                url('../asset/bg-maharati.gif');
            background-size: 24px 24px, cover, cover;
            background-position: 0 0, center, center;
            background-attachment: fixed;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden; /* Zero scroll layout pada layar 16:9 */
        }
        .font-game { font-family: 'Fredoka', sans-serif; }
        .font-cursive { font-family: 'Dancing Script', cursive; }
        
        .duo-card {
            background: #ffffff;
            border: 3px solid #fecdd3;
            border-bottom-width: 6px;
            transition: all 0.15s ease-in-out;
        }

        .btn-duo-rose {
            background-color: var(--duo-rose);
            box-shadow: 0 4px 0 0 var(--duo-rose-shadow);
        }
        .btn-duo-rose:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 0 var(--duo-rose-shadow);
        }

        .btn-duo-green {
            background-color: var(--duo-green);
            box-shadow: 0 4px 0 0 var(--duo-green-shadow);
        }
        .btn-duo-green:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 0 var(--duo-green-shadow);
        }

        .btn-duo-white {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-bottom: 4px solid #cbd5e1;
            color: #334155;
            transition: all 0.1s ease;
        }
        .btn-duo-white:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        #draw-canvas {
            touch-action: none;
            cursor: crosshair;
        }

        /* Bayangan Huruf Sambung untuk Dijiplak (Tracing Guide) */
        .ghost-trace {
            font-family: 'Dancing Script', cursive;
            user-select: none;
            pointer-events: none;
            color: rgba(225, 29, 72, 0.16);
            letter-spacing: 2px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-2 sm:p-4 text-slate-800">

    <!-- Audio Elements -->
    <audio id="snd-click" src="../asset/click.mp3" preload="auto"></audio>
    <audio id="snd-right" src="../asset/right.mp3" preload="auto"></audio>
    <audio id="snd-victory" src="../asset/victory.mp3" preload="auto"></audio>

    <!-- HEADER NAVIGATION -->
    <header class="max-w-4xl w-full mx-auto flex items-center justify-between gap-2 shrink-0 py-1">
        <a href="../index.html" onclick="playClickSound()" class="btn-duo-white px-3 py-1.5 rounded-xl text-xs font-black uppercase flex items-center gap-1.5 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Menu Utama</span>
        </a>

        <!-- Selector Tingkat Kesulitan -->
        <div class="flex items-center bg-white p-1 rounded-2xl border-2 border-slate-200 shadow-sm gap-1">
            <button id="tab-lvl-easy" onclick="changeDifficulty('easy')" class="px-3 py-1 rounded-xl font-black text-[11px] uppercase transition bg-emerald-100 text-emerald-800 border-2 border-emerald-400">
                🟢 Mudah
            </button>
            <button id="tab-lvl-medium" onclick="changeDifficulty('medium')" class="px-3 py-1 rounded-xl font-black text-[11px] uppercase transition text-slate-600 hover:bg-slate-100">
                🟠 Sedang
            </button>
            <button id="tab-lvl-hard" onclick="changeDifficulty('hard')" class="px-3 py-1 rounded-xl font-black text-[11px] uppercase transition text-slate-600 hover:bg-slate-100">
                🔴 Sulit
            </button>
        </div>

        <div class="flex items-center gap-2">
            <div class="px-3 py-1.5 rounded-xl bg-rose-100 border-2 border-rose-300 font-bold text-xs text-rose-800 flex items-center gap-1.5 shadow-sm">
                <i data-lucide="user" class="w-3.5 h-3.5 text-rose-600"></i>
                <span id="student-badge" class="max-w-[80px] sm:max-w-[120px] truncate">Siswa Baru</span>
            </div>

            <div class="px-3 py-1.5 rounded-xl bg-amber-100 border-2 border-amber-300 font-black text-xs text-amber-800 flex items-center gap-1.5 shadow-sm">
                <i data-lucide="flame" class="w-3.5 h-3.5 fill-amber-500 text-amber-500"></i>
                <span id="score-display">0 XP</span>
            </div>
        </div>
    </header>

    <!-- WORKSPACE UTAMA: TAMPILAN BEBAS GULIR 16:9 -->
    <main class="max-w-3xl w-full mx-auto flex-1 flex flex-col justify-center py-1">
        <div class="duo-card rounded-[2rem] p-3.5 sm:p-5 bg-white flex flex-col justify-between shadow-md space-y-2">
            
            <!-- Baris Status & Tindakan Cepat -->
            <div class="flex items-center justify-between border-b border-rose-100 pb-2">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></span>
                    <span class="text-xs font-black uppercase text-rose-600 tracking-wider font-game">Cursive Board</span>
                    <span id="level-badge-card" class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-300 uppercase">🟢 Level: Mudah</span>
                </div>

                <div class="flex items-center gap-2">
                    <span id="round-indicator" class="px-2.5 py-1 rounded-xl bg-slate-100 border border-slate-200 font-black text-[11px] text-slate-700">
                        Kata 1 / 5
                    </span>
                    <!-- Tombol Pelafalan Suara (TTS) -->
                    <button onclick="speakCurrentWord()" title="Dengarkan Pengucapan Kata" class="btn-duo-white px-2.5 py-1 rounded-xl text-xs font-bold text-rose-600 flex items-center gap-1">
                        <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Bunyi</span>
                    </button>
                    <!-- Tombol Panduan Jiplak Huruf (Ghost Tracing) -->
                    <button id="btn-toggle-ghost" onclick="toggleGhostGuide()" title="Sembunyikan / Tampilkan Panduan Bayangan Huruf" class="btn-duo-white px-2.5 py-1 rounded-xl text-xs font-bold text-amber-600 flex items-center gap-1">
                        <i data-lucide="eye" id="icon-ghost" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Pola Jiplak</span>
                    </button>
                    <!-- Tombol Bersihkan Kanvas -->
                    <button onclick="clearCanvas()" title="Hapus Goresan" class="btn-duo-white px-2.5 py-1 rounded-xl text-xs font-bold text-slate-600 flex items-center gap-1">
                        <i data-lucide="eraser" class="w-3.5 h-3.5"></i>
                        <span>Hapus</span>
                    </button>
                </div>
            </div>

            <!-- Banner Kata Target & Arti -->
            <div class="text-center py-1 bg-gradient-to-b from-rose-50/70 to-transparent rounded-2xl relative">
                <div class="flex items-center justify-center gap-3">
                    <h2 id="target-word-display" class="text-4xl sm:text-5xl font-cursive text-slate-800 drop-shadow-sm tracking-wide">
                        Cat
                    </h2>
                    <span id="target-meaning-display" class="text-xs sm:text-sm font-bold text-slate-500 italic bg-white px-2.5 py-1 rounded-xl border border-rose-200">
                        (Kucing)
                    </span>
                </div>
            </div>

            <!-- AREA KANVAS DENGAN 3 GARIS BUKU HALUS & GHOST TRACING -->
            <div class="relative w-full rounded-2xl border-2 border-slate-300 bg-white overflow-hidden shadow-inner flex flex-col justify-center">
                
                <!-- 3 Garis Bantu Buku Halus (Notebook Ruled Guide Lines) -->
                <div class="absolute inset-0 pointer-events-none flex flex-col justify-around py-5 px-4 opacity-35 z-0">
                    <div class="w-full border-b border-dashed border-rose-400"></div>
                    <div class="w-full border-b-2 border-rose-500"></div>
                    <div class="w-full border-b border-dashed border-rose-400"></div>
                </div>

                <!-- Bayangan Pola Jiplak di Belakang Kanvas (Ghost Tracing Guide) -->
                <div id="ghost-trace-container" class="absolute inset-0 flex items-center justify-center z-0">
                    <span id="ghost-trace-text" class="ghost-trace text-5xl sm:text-6xl md:text-7xl font-cursive">
                        Cat
                    </span>
                </div>

                <!-- Kanvas Menggambar Sentuh / Mouse -->
                <canvas id="draw-canvas" class="w-full h-44 sm:h-52 z-10"></canvas>
            </div>

            <!-- PALET WARNA PENA & KETEBALAN -->
            <div class="flex flex-wrap items-center justify-between gap-2 pt-0.5 text-xs">
                <div class="flex items-center gap-1.5">
                    <span class="font-bold text-slate-500 text-[11px] uppercase">Warna:</span>
                    <button onclick="setPenColor('#e11d48')" class="w-6 h-6 rounded-full bg-rose-600 border-2 border-white shadow-sm ring-2 ring-rose-400 focus:scale-110 transition-transform" title="Merah Mawar"></button>
                    <button onclick="setPenColor('#2563eb')" class="w-6 h-6 rounded-full bg-blue-600 border-2 border-white shadow-sm hover:scale-105 transition-transform" title="Biru Tinta"></button>
                    <button onclick="setPenColor('#0f172a')" class="w-6 h-6 rounded-full bg-slate-900 border-2 border-white shadow-sm hover:scale-105 transition-transform" title="Hitam"></button>
                    <button onclick="setPenColor('#16a34a')" class="w-6 h-6 rounded-full bg-emerald-600 border-2 border-white shadow-sm hover:scale-105 transition-transform" title="Hijau"></button>
                    <button onclick="setPenColor('#7c3aed')" class="w-6 h-6 rounded-full bg-purple-600 border-2 border-white shadow-sm hover:scale-105 transition-transform" title="Ungu"></button>
                </div>

                <div class="flex items-center gap-1.5">
                    <span class="font-bold text-slate-500 text-[11px] uppercase">Pena:</span>
                    <button id="size-btn-3" onclick="setPenSize(3)" class="px-2 py-0.5 rounded-lg border border-slate-200 font-bold hover:bg-slate-100">Halus</button>
                    <button id="size-btn-5" onclick="setPenSize(5)" class="px-2 py-0.5 rounded-lg border-2 border-rose-300 bg-rose-50 text-rose-700 font-black">Sedang</button>
                    <button id="size-btn-8" onclick="setPenSize(8)" class="px-2 py-0.5 rounded-lg border border-slate-200 font-bold hover:bg-slate-100">Tebal</button>
                </div>
            </div>

            <!-- Tombol Selesai & Lanjut Kata Berikutnya -->
            <button id="btn-submit-word" onclick="finishWord()" class="w-full py-2.5 sm:py-3 rounded-xl btn-duo-rose text-white font-black text-xs sm:text-sm uppercase tracking-wider transition flex items-center justify-center gap-2 shadow-sm">
                <span id="btn-submit-text">SELESAI & SIMPAN KATA (+15 XP)</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </div>
    </main>

    <!-- Modal Rekapitulasi Selesai 5 Kata -->
    <div id="session-summary-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="duo-card rounded-[2.5rem] max-w-md w-full p-6 text-center space-y-4 bg-white shadow-2xl">
            <div class="w-16 h-16 bg-rose-100 rounded-3xl mx-auto flex items-center justify-center text-rose-600 shadow-[0_4px_0_0_#fecdd3]">
                <i data-lucide="award" class="w-8 h-8"></i>
            </div>
            <div>
                <span class="text-[10px] font-extrabold uppercase tracking-widest text-rose-600 font-game">Sesi Latihan Selesai!</span>
                <h3 class="text-2xl font-black font-game text-slate-800 mt-1">Hasil Menulis Indah Cursive</h3>
                <p id="summary-level-tag" class="text-xs font-bold text-slate-400 mt-0.5">Tingkat: 🟢 Mudah</p>
            </div>
            
            <div class="p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl flex justify-around items-center">
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Kata Diselesaikan</p>
                    <p id="summary-completed-count" class="text-2xl font-black text-rose-600 font-game">5 / 5</p>
                </div>
                <div class="w-px h-10 bg-slate-200"></div>
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Perolehan XP</p>
                    <p id="summary-xp-earned" class="text-2xl font-black text-amber-500 font-game">+75 XP</p>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-2 pt-1">
                <button onclick="startNewCursiveSession()" class="flex-1 py-3.5 rounded-2xl btn-duo-rose text-white font-black text-xs uppercase tracking-wider flex items-center justify-center gap-1.5 shadow-md">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    <span>5 Kata Acak Baru</span>
                </button>
                <a href="../index.html" class="px-5 py-3.5 rounded-2xl btn-duo-white text-slate-700 font-black text-xs uppercase flex items-center justify-center gap-1">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    <span>Menu</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Feedback Toast -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 max-w-sm w-full p-3 rounded-2xl text-center font-black text-white text-xs shadow-xl z-50 transition-all"></div>

    <script>
        // ==============================================================
        // 1. BANK DATA LENGKAP 90 KATA (30 EASY, 30 MEDIUM, 30 HARD)
        // ==============================================================
        const CURSIVE_DATABASE = {
            easy: [
                { word: "Cat", id: "Kucing" }, { word: "Sun", id: "Matahari" }, { word: "Pen", id: "Pulpen" },
                { word: "Dog", id: "Anjing" }, { word: "Cup", id: "Cangkir" }, { word: "Red", id: "Merah" },
                { word: "Sky", id: "Langit" }, { word: "Boy", id: "Anak Laki-laki" }, { word: "Bat", id: "Kelelawar" },
                { word: "Hat", id: "Topi" }, { word: "Bed", id: "Tempat Tidur" }, { word: "Box", id: "Kotak" },
                { word: "Egg", id: "Telur" }, { word: "Fly", id: "Terbang" }, { word: "Ice", id: "Es" },
                { word: "Jam", id: "Selai" }, { word: "Key", id: "Kunci" }, { word: "Leg", id: "Kaki" },
                { word: "Map", id: "Peta" }, { word: "Net", id: "Jaring" }, { word: "Owl", id: "Burung Hantu" },
                { word: "Pig", id: "Babi" }, { word: "Run", id: "Berlari" }, { word: "Tea", id: "Teh" },
                { word: "Van", id: "Mobil Van" }, { word: "Wet", id: "Basah" }, { word: "Zoo", id: "Kebun Binatang" },
                { word: "Bee", id: "Lebah" }, { word: "Ant", id: "Semut" }, { word: "Joy", id: "Sukacita" }
            ],
            medium: [
                { word: "Apple", id: "Apel" }, { word: "Bread", id: "Roti" }, { word: "Cloud", id: "Awan" },
                { word: "Dream", id: "Mimpi" }, { word: "Earth", id: "Bumi" }, { word: "Flower", id: "Bunga" },
                { word: "Garden", id: "Taman" }, { word: "House", id: "Rumah" }, { word: "Island", id: "Pulau" },
                { word: "Jungle", id: "Hutan Rimba" }, { word: "Kitten", id: "Anak Kucing" }, { word: "Lemon", id: "Lemon" },
                { word: "Morning", id: "Pagi Hari" }, { word: "Nature", id: "Alam" }, { word: "Orange", id: "Jeruk" },
                { word: "Purple", id: "Ungu" }, { word: "Queen", id: "Ratu" }, { word: "Rabbit", id: "Kelinci" },
                { word: "Silver", id: "Perak" }, { word: "Tiger", id: "Harimau" }, { word: "Umbrella", id: "Payung" },
                { word: "Violet", id: "Lembayung" }, { word: "Winter", id: "Musim Dingin" }, { word: "Yellow", id: "Kuning" },
                { word: "Zebra", id: "Zebra" }, { word: "Bridge", id: "Jembatan" }, { word: "Coffee", id: "Kopi" },
                { word: "Doctor", id: "Dokter" }, { word: "Energy", id: "Energi" }, { word: "Family", id: "Keluarga" }
            ],
            hard: [
                { word: "Beautiful", id: "Indah / Cantik" }, { word: "Butterfly", id: "Kupu-kupu" }, { word: "Champion", id: "Juara" },
                { word: "Dangerous", id: "Berbahaya" }, { word: "Education", id: "Pendidikan" }, { word: "Fantastic", id: "Luar Biasa" },
                { word: "Gratitude", id: "Rasa Syukur" }, { word: "Happiness", id: "Kebahagiaan" }, { word: "Important", id: "Penting" },
                { word: "Knowledge", id: "Pengetahuan" }, { word: "Lightning", id: "Petir" }, { word: "Mountain", id: "Gunung" },
                { word: "Notebook", id: "Buku Catatan" }, { word: "Orchestra", id: "Orkestra" }, { word: "Platinum", id: "Platinum" },
                { word: "Question", id: "Pertanyaan" }, { word: "Rainfall", id: "Curah Hujan" }, { word: "Sunshine", id: "Sinar Mentari" },
                { word: "Together", id: "Bersama-sama" }, { word: "Universe", id: "Alam Semesta" }, { word: "Vacation", id: "Liburan" },
                { word: "Wildlife", id: "Satwa Liar" }, { word: "Yesterday", id: "Kemarin" }, { word: "Adventure", id: "Petualangan" },
                { word: "Brilliant", id: "Cemerlang" }, { word: "Celebrate", id: "Merayakan" }, { word: "Discovery", id: "Penemuan" },
                { word: "Elephant", id: "Gajah" }, { word: "Frequency", id: "Frekuensi" }, { word: "Geography", id: "Geografi" }
            ]
        };

        // ==============================================================
        // 2. STATE DAN PERSISTENSI TINGKAT KESULITAN
        // ==============================================================
        const urlParams = new URLSearchParams(window.location.search);
        let currentDifficulty = urlParams.get('lvl') || localStorage.getItem('maharati_difficulty') || 'easy';
        currentDifficulty = currentDifficulty.toLowerCase();
        if (!['easy', 'medium', 'hard'].includes(currentDifficulty)) currentDifficulty = 'easy';

        const SESSION_WORD_COUNT = 5;
        let sessionWords = [];
        let sessionIndex = 0;
        let strokePoints = 0;
        let showGhostGuide = true;

        const studentName = localStorage.getItem('studentName') || "Siswa Baru";

        // Audio Engine Procedural
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const Cls = window.AudioContext || window.webkitAudioContext;
                if (Cls) audioCtx = new Cls();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, dur = 0.08, type = 'sine', gainVal = 0.16) {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(gainVal, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + dur);
            } catch(e) {}
        }

        function playSound(elementId, fallbackFreq = 650) {
            const el = document.getElementById(elementId);
            if (el && el.readyState >= 2) {
                el.currentTime = 0;
                el.play().catch(() => playTone(fallbackFreq));
            } else {
                playTone(fallbackFreq);
            }
        }

        function playClickSound() { playSound('snd-click', 650); }

        // ==============================================================
        // 3. PENGACAKAN 5 KATA DARI 30 BANK KATA
        // ==============================================================
        function shuffleArray(arr) {
            const copied = [...arr];
            for (let i = copied.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copied[i], copied[j]] = [copied[j], copied[i]];
            }
            return copied;
        }

        function changeDifficulty(lvl) {
            playClickSound();
            currentDifficulty = lvl;
            localStorage.setItem('maharati_difficulty', lvl);
            localStorage.setItem('studentLevel', lvl);
            updateDifficultyTabsUI();
            startNewCursiveSession();
        }

        function updateDifficultyTabsUI() {
            const tabs = ['easy', 'medium', 'hard'];
            const labels = {
                easy: { name: '🟢 Level: Mudah', border: 'border-emerald-300', bg: 'bg-emerald-50', text: 'text-emerald-700' },
                medium: { name: '🟠 Level: Sedang', border: 'border-amber-300', bg: 'bg-amber-50', text: 'text-amber-800' },
                hard: { name: '🔴 Level: Sulit', border: 'border-rose-300', bg: 'bg-rose-50', text: 'text-rose-800' }
            };

            tabs.forEach(t => {
                const btn = document.getElementById(`tab-lvl-${t}`);
                if (!btn) return;
                if (t === currentDifficulty) {
                    btn.className = `px-3 py-1 rounded-xl font-black text-[11px] uppercase transition shadow-sm ${t === 'easy' ? 'bg-emerald-100 text-emerald-800 border-2 border-emerald-400' : (t === 'medium' ? 'bg-amber-100 text-amber-800 border-2 border-amber-400' : 'bg-rose-100 text-rose-800 border-2 border-rose-400')}`;
                } else {
                    btn.className = "px-3 py-1 rounded-xl font-black text-[11px] uppercase transition text-slate-600 hover:bg-slate-100";
                }
            });

            const cardBadge = document.getElementById('level-badge-card');
            if (cardBadge) {
                const cfg = labels[currentDifficulty];
                cardBadge.className = `text-[10px] font-extrabold px-2 py-0.5 rounded-full ${cfg.bg} ${cfg.text} border ${cfg.border} uppercase`;
                cardBadge.innerText = cfg.name;
            }
        }

        function startNewCursiveSession() {
            document.getElementById('session-summary-modal').classList.add('hidden');
            const pool = CURSIVE_DATABASE[currentDifficulty] || CURSIVE_DATABASE.easy;
            sessionWords = shuffleArray(pool).slice(0, SESSION_WORD_COUNT);
            sessionIndex = 0;
            loadCurrentWord();
        }

        // ==============================================================
        // 4. ENGINE KANVAS TULISAN TANGAN (HIGH DPR & SMOOTH TOUCH)
        // ==============================================================
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        let isPainting = false;
        let penColor = '#e11d48';
        let penSize = 5;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = penColor;
            ctx.lineWidth = penSize;
        }

        function getCanvasPoint(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            isPainting = true;
            strokePoints++;
            const pt = getCanvasPoint(e);
            ctx.beginPath();
            ctx.moveTo(pt.x, pt.y);
        }

        function draw(e) {
            if (!isPainting) return;
            strokePoints++;
            const pt = getCanvasPoint(e);
            ctx.lineTo(pt.x, pt.y);
            ctx.strokeStyle = penColor;
            ctx.lineWidth = penSize;
            ctx.stroke();
        }

        function stopDrawing() {
            isPainting = false;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
        window.addEventListener('touchend', stopDrawing);

        function clearCanvas() {
            playClickSound();
            strokePoints = 0;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function setPenColor(color) {
            playClickSound();
            penColor = color;
        }

        function setPenSize(size) {
            playClickSound();
            penSize = size;
            [3, 5, 8].forEach(s => {
                const btn = document.getElementById(`size-btn-${s}`);
                if (btn) {
                    if (s === size) {
                        btn.className = "px-2 py-0.5 rounded-lg border-2 border-rose-300 bg-rose-50 text-rose-700 font-black";
                    } else {
                        btn.className = "px-2 py-0.5 rounded-lg border border-slate-200 font-bold hover:bg-slate-100";
                    }
                }
            });
        }

        function toggleGhostGuide() {
            playClickSound();
            showGhostGuide = !showGhostGuide;
            const ghostText = document.getElementById('ghost-trace-text');
            const iconGhost = document.getElementById('icon-ghost');
            if (showGhostGuide) {
                ghostText.style.display = 'block';
                iconGhost.setAttribute('data-lucide', 'eye');
            } else {
                ghostText.style.display = 'none';
                iconGhost.setAttribute('data-lucide', 'eye-off');
            }
            if (window.lucide && lucide.createIcons) lucide.createIcons();
        }

        // ==============================================================
        // 5. MANAJEMEN KATA DAN ADVANCEMENT
        // ==============================================================
        function loadCurrentWord() {
            if (sessionWords.length === 0) {
                startNewCursiveSession();
                return;
            }

            const item = sessionWords[sessionIndex];
            document.getElementById('target-word-display').innerText = item.word;
            document.getElementById('target-meaning-display').innerText = `(${item.id})`;
            document.getElementById('ghost-trace-text').innerText = item.word;
            document.getElementById('round-indicator').innerText = `Kata ${sessionIndex + 1} / ${SESSION_WORD_COUNT}`;

            const btnText = document.getElementById('btn-submit-text');
            if (sessionIndex === SESSION_WORD_COUNT - 1) {
                btnText.innerText = "SELESAI & LIHAT HASIL";
            } else {
                btnText.innerText = "SELESAI & SIMPAN KATA (+15 XP)";
            }

            clearCanvas();
        }

        function speakCurrentWord() {
            playClickSound();
            if ('speechSynthesis' in window && sessionWords.length > 0) {
                window.speechSynthesis.cancel();
                const item = sessionWords[sessionIndex];
                const u = new SpeechSynthesisUtterance(item.word);
                u.lang = 'en-US';
                u.rate = 0.85;
                window.speechSynthesis.speak(u);
            }
        }

        function finishWord() {
            // Validasi goresan agar siswa benar-benar menulis di kanvas
            if (strokePoints < 18) {
                showToast("⚠️ Tuliskan huruf dengan lebih lengkap di kanvas ya!", false);
                return;
            }

            playSound('snd-right', 880);
            addStudentXP(15);
            showToast("✨ Tulisan tercatat! (+15 XP)", true);

            sessionIndex++;
            if (sessionIndex >= SESSION_WORD_COUNT) {
                setTimeout(showSessionSummary, 600);
            } else {
                setTimeout(loadCurrentWord, 600);
            }
        }

        function showSessionSummary() {
            playSound('snd-victory', 900);
            const modal = document.getElementById('session-summary-modal');
            const completedEl = document.getElementById('summary-completed-count');
            const xpEl = document.getElementById('summary-xp-earned');
            const levelTagEl = document.getElementById('summary-level-tag');

            completedEl.innerText = `${SESSION_WORD_COUNT} / ${SESSION_WORD_COUNT}`;
            xpEl.innerText = `+${SESSION_WORD_COUNT * 15} XP`;

            const levelNames = { easy: '🟢 Level: Mudah', medium: '🟠 Level: Sedang', hard: '🔴 Level: Sulit' };
            levelTagEl.innerText = `Tingkat: ${levelNames[currentDifficulty] || 'Mudah'}`;

            modal.classList.remove('hidden');
            if (window.lucide && lucide.createIcons) lucide.createIcons();
        }

        // ==============================================================
        // 6. PENYIMPANAN SKOR XP & INISIALISASI
        // ==============================================================
        function addStudentXP(pts) {
            const current = parseInt(localStorage.getItem('maharati_student_xp')) || 0;
            const newTotal = current + pts;
            localStorage.setItem('maharati_student_xp', newTotal);
            document.getElementById('score-display').innerText = `${newTotal} XP`;

            let visited = JSON.parse(localStorage.getItem('maharati_visited_modules')) || [];
            if (!visited.includes('Cursive')) {
                visited.push('Cursive');
                localStorage.setItem('maharati_visited_modules', JSON.stringify(visited));
            }
        }

        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById('toast');
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 max-w-sm w-full p-3 rounded-2xl text-center font-black text-white text-xs shadow-xl z-50 transition-all ${isSuccess ? 'bg-rose-600' : 'bg-amber-600'}`;
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2200);
        }

        window.onload = () => {
            document.getElementById('student-badge').innerText = studentName;
            const currentXP = parseInt(localStorage.getItem('maharati_student_xp')) || 0;
            document.getElementById('score-display').innerText = `${currentXP} XP`;
            
            updateDifficultyTabsUI();
            resizeCanvas();
            startNewCursiveSession();
            if (window.lucide && lucide.createIcons) lucide.createIcons();
        };

        window.onresize = resizeCanvas;
    </script>
</body>
</html>
